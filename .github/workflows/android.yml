name: Build SEVBY HQ Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # Signing secrets only for builds of main and android-v… tags; other branches / PRs use a debug key.
    env:
      SEVBYHQ_KEYSTORE_BASE64: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBYHQ_KEYSTORE_BASE64 || '' }}
      SEVBYHQ_KEYSTORE_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBYHQ_KEYSTORE_PASSWORD || '' }}
      SEVBYHQ_KEY_ALIAS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBYHQ_KEY_ALIAS || '' }}
      SEVBYHQ_KEY_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBYHQ_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          # Test build of the NEXT version: VERSION 0.10.2-beta in sevby_app.py -> 0.10.3-dev.<run>.
          # It installs over the 0.10.2-beta release, and the next release later installs over it.
          # (The internal versionCode is worked out from this name in app/build.gradle.kts.)
          V=$(grep -m1 '^VERSION = ' ../sevby_app.py | sed 's/.*"\(.*\)".*/\1/')
          core=${V%%-*}; IFS=. read -r a b c <<< "$core"
          echo "SEVBYHQ_VERSION_NAME=$a.$b.$((c + 1))-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Signing key (from repo secrets, if set)
        run: |
          if [ -n "$SEVBYHQ_KEYSTORE_BASE64" ]; then
            echo "$SEVBYHQ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sevbyhq.jks"
            echo "SEVBYHQ_KEYSTORE=$RUNNER_TEMP/sevbyhq.jks" >> "$GITHUB_ENV"
            echo "Signing with the SEVBY HQ release key"
          else
            echo "::warning::No SEVBYHQ_KEYSTORE_BASE64 secret - the APK is signed with a throwaway debug key. Add the 4 SEVBYHQ_KEYSTORE_* / SEVBYHQ_KEY_* secrets to this repo for a real release build."
          fi
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Name the APKs
        run: |
          mkdir -p ../out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release(-unsigned)?\.apk$/\1/')
            cp "$f" "../out/SEVBY-HQ-${SEVBYHQ_VERSION_NAME}-${abi}.apk"
          done
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: SEVBY-HQ-android-${{ env.SEVBYHQ_VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error
