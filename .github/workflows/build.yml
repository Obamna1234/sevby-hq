name: Build SEVBY HQ

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also upload the new builds to the newest release"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 03:00 UTC

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Linux: Tk"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Get ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install (always the newest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -U yt-dlp

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: SEVBY-HQ-${{ runner.os }}
          path: dist/*

  # Monthly (or when you tick "publish" on a manual run): put the fresh builds
  # onto the newest release, replacing the old files. Skipped if any build failed.
  publish:
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each build
        run: |
          for d in artifacts/SEVBY-HQ-*; do
            name=$(basename "$d")
            (cd "$d" && zip -r -q "../../$name.zip" .)
          done
          ls -l *.zip

      - name: Replace the files on the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$tag" ]; then echo "No release found - nothing to update"; exit 1; fi
          echo "Updating release $tag"
          gh release upload "$tag" SEVBY-HQ-Windows.zip SEVBY-HQ-Linux.zip SEVBY-HQ-macOS.zip --clobber
          gh release view "$tag" --json body --jq .body | grep -v '^Last automatic rebuild:' > notes.md || true
          printf '\nLast automatic rebuild: %s (with the newest yt-dlp at that time)\n' "$(date -u +%F)" >> notes.md
          gh release edit "$tag" --notes-file notes.md
